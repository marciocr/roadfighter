name: Build packages

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-latest
    # Built on an old Ubuntu so the AppImage runs on older distros too
    # (an AppImage needs a glibc at least as new as the one it was built on).
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build AppImage
        run: scripts/build-appimage.sh --setup
      - uses: actions/upload-artifact@v4
        with:
          name: RoadFighter-x86_64.AppImage
          path: dist/RoadFighter-x86_64.AppImage
          if-no-files-found: error

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: RoadFighter.flatpak
          manifest-path: io.github.marciocr.RoadFighter.yml
          cache-key: flatpak-builder-${{ github.sha }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
